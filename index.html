<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPL Mega Auction 2027 — Live Cricket Auction Room</title>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/teko/index.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/barlow/index.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --ink:#06101F; --panel:#0C1B30; --panel2:#102742; --line:rgba(245,197,24,.16);
  --gold:#F5C518; --gold2:#FFD84D; --red:#FF4136; --green:#2ECC71; --mute:#8FA3BF; --txt:#EAF1FB;
  --bat:#4DA3FF; --bowl:#FF6B5E; --ar:#C77DFF; --wk:#35D0BA;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Barlow',sans-serif;background:var(--ink);color:var(--txt);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% -10%,rgba(245,197,24,.10),transparent 55%),
             radial-gradient(90% 70% at 100% 100%,rgba(46,155,230,.10),transparent 60%),
             radial-gradient(120% 120% at 50% 50%,transparent 55%,rgba(0,0,0,.65) 100%);}
#bg3d{position:fixed;inset:0;z-index:0;pointer-events:none}
.lightsweep{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(245,197,24,.05) 50%,transparent 62%);
  background-size:220% 100%;animation:pan 11s linear infinite}
@keyframes pan{to{background-position:-220% 0}}
#app{position:relative;z-index:2}
.lbl{font:600 11px/1 'Barlow';letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.corners{position:relative}
.corners::before,.corners::after{content:'';position:absolute;width:20px;height:20px;border:2px solid var(--gold);pointer-events:none;z-index:3}
.corners::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.corners::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:6px}
button{font-family:'Barlow'}
.btn{font-family:'Teko';font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;border:none;cursor:pointer;
  padding:10px 22px;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);transition:.18s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1200;font-weight:600}
.btn-gold:hover{filter:brightness(1.1);transform:translateY(-2px);box-shadow:0 8px 24px rgba(245,197,24,.35)}
.btn-ghost{background:rgba(245,197,24,.08);color:var(--gold);border:1px solid var(--gold);clip-path:none;border-radius:5px}
.btn-ghost:hover{background:rgba(245,197,24,.18)}
.btn-red{background:linear-gradient(180deg,#ff6b62,var(--red));color:#fff;font-weight:600}
.btn-green{background:linear-gradient(180deg,#46e08a,var(--green));color:#06210f;font-weight:600}
.btn-red:hover,.btn-green:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn:disabled{opacity:.32;cursor:not-allowed;transform:none;filter:none;box-shadow:none}
.btn-sm{padding:6px 14px;font-size:1rem}
input,select,textarea{font-family:'Barlow';background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:5px;color:#fff;padding:11px 13px;width:100%;font-size:.98rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,197,24,.12)}
select option{background:var(--panel)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(245,197,24,.4);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

.hdr{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:12px 26px;
  background:linear-gradient(180deg,rgba(8,18,34,.97),rgba(8,18,34,.82));backdrop-filter:blur(8px);border-bottom:2px solid var(--gold)}
.crest{width:46px;height:46px;display:grid;place-items:center;font-size:1.7rem;background:radial-gradient(circle at 30% 30%,var(--gold2),var(--gold));
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);color:#1a1200;flex:none}
.brand .t{font-family:'Teko';font-size:1.9rem;letter-spacing:.04em;line-height:.9}
.brand .s{font-size:.7rem;letter-spacing:.22em;color:var(--mute);text-transform:uppercase}
.brand .s b{color:var(--red)}
.hdr .spacer{flex:1}
.hdr .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:1.1rem;transition:.18s;color:#fff}
.iconbtn:hover{border-color:var(--gold);color:var(--gold);transform:rotate(20deg)}
.uchip{display:flex;align-items:center;gap:8px;background:rgba(245,197,24,.1);border:1px solid var(--gold);border-radius:30px;padding:6px 14px;font-weight:600}
.uchip .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.syncwrap{display:flex;align-items:center;gap:8px;font:700 .62rem/1 'Barlow';letter-spacing:.16em;color:var(--mute);border:1px solid var(--line);border-radius:30px;padding:9px 13px}
.syncwrap b{color:var(--gold)}
.syncwrap .cloud{color:var(--green)}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 2.2s infinite;flex:none}
.syncdot.pulse{animation:syncPulse .55s}
@keyframes syncPulse{0%{transform:scale(2.4);background:var(--gold);box-shadow:0 0 20px var(--gold)}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:.3}}

.nav{display:flex;gap:8px;padding:12px 26px;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(8,18,34,.5)}
.ntab{font-family:'Teko';font-size:1.25rem;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;
  padding:6px 20px;border-radius:5px;border:1px solid transparent;color:var(--mute);cursor:pointer;transition:.18s}
.ntab:hover{color:#fff}
.ntab.on{color:#1a1200;background:var(--gold);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.main{padding:24px 26px 60px;max-width:1500px;margin:0 auto}

.ticker{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:22px;background:var(--panel)}
.ticker .tag{background:var(--red);color:#fff;font-family:'Teko';font-size:1.2rem;letter-spacing:.1em;padding:8px 16px;display:flex;align-items:center;transform:skewX(-9deg)}
.ticker .tag span{transform:skewX(9deg);display:flex;align-items:center;gap:8px}
.ticker .tag i{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1s infinite}
.ticker .trackwrap{flex:1;overflow:hidden;display:flex;align-items:center}
.ticker .track{display:inline-flex;gap:34px;white-space:nowrap;padding-left:100%;animation:tick 32s linear infinite;font-size:.95rem}
.ticker .track b{color:var(--gold)}
.ticker .track .sep{color:var(--mute)}
@keyframes tick{to{transform:translateX(-100%)}}

.block{display:grid;grid-template-columns:minmax(280px,1fr) 1.15fr;gap:22px;margin-bottom:24px;animation:blockIn .55s cubic-bezier(.2,1.2,.4,1)}
@keyframes blockIn{from{opacity:0;transform:translateY(26px) scale(.97)}}
.ab-player{padding:26px;text-align:center}
.ab-player .photo{width:200px;height:200px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:4px solid var(--gold);
  box-shadow:0 0 0 6px rgba(245,197,24,.12),0 18px 40px rgba(0,0,0,.5);animation:floaty 5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px)}}
.ab-player .nm{font-family:'Teko';font-size:2.6rem;letter-spacing:.02em}
.chip{display:inline-block;font:700 .72rem/1 'Barlow';letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:30px;margin:4px 3px}
.chip.bat{background:rgba(77,163,255,.16);color:var(--bat);border:1px solid var(--bat)}
.chip.bowl{background:rgba(255,107,94,.16);color:var(--bowl);border:1px solid var(--bowl)}
.chip.ar{background:rgba(199,125,255,.16);color:var(--ar);border:1px solid var(--ar)}
.chip.wk{background:rgba(53,208,186,.16);color:var(--wk);border:1px solid var(--wk)}
.pf{color:var(--mute);font-style:italic;font-size:.92rem;max-width:340px;margin:12px auto 0;line-height:1.5}
.base{margin-top:14px;font-family:'Teko';font-size:1.4rem;color:var(--mute)}
.base b{color:#fff}
.ab-bid{padding:26px;display:flex;flex-direction:column}
.onair{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:6px;background:rgba(255,65,54,.15);border:1px solid var(--red);color:var(--red);font:700 .62rem/1 'Barlow';letter-spacing:.2em;padding:6px 10px;border-radius:3px;z-index:4}
.onair i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink .9s infinite}
.bidrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding-bottom:16px}
.bidnow .num{font-family:'Teko';font-weight:600;color:var(--gold);font-size:clamp(58px,8vw,108px);line-height:.85;text-shadow:0 0 30px rgba(245,197,24,.4)}
.bidnow .num.pop{animation:bidPop .4s}
@keyframes bidPop{0%{transform:scale(1.22);color:#fff}100%{transform:scale(1)}}
.bidnow .await{font-family:'Teko';font-size:2.4rem;color:var(--mute);line-height:1}
.leadbox{text-align:right}
.leadbox .lbl{margin-bottom:6px}
.leadbox .who{font-family:'Teko';font-size:1.9rem;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.leadbox .who .sw{width:14px;height:14px;border-radius:3px;flex:none}
.leadbox .none{color:var(--mute);font-family:'Teko';font-size:1.6rem}
.ladder-lbl{margin:18px 0 8px}
.tchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tchip{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:6px;padding:9px 8px 9px 12px;cursor:pointer;transition:.16s;text-align:left;position:relative;overflow:hidden;color:#fff}
.tchip::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.tchip:hover{border-color:var(--gold)}
.tchip.sel{border-color:var(--gold);background:rgba(245,197,24,.12);box-shadow:0 0 0 1px var(--gold) inset}
.tchip:disabled{opacity:.3;cursor:not-allowed}
.tchip .n{font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:6px}
.tchip .n .sw{width:10px;height:10px;border-radius:3px;flex:none}
.tchip .p{font-family:'Teko';font-size:1.15rem;color:var(--gold);line-height:1}
.tchip .ld{position:absolute;top:6px;right:6px;font-size:.55rem;background:var(--green);color:#06210f;padding:2px 6px;border-radius:3px;font-weight:700;letter-spacing:.08em}
.ladder{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px}
.lbtn{font-family:'Teko';font-size:1.35rem;letter-spacing:.03em;padding:8px 18px;border-radius:6px;cursor:pointer;transition:.15s;
  background:linear-gradient(180deg,rgba(245,197,24,.18),rgba(245,197,24,.06));border:1px solid var(--gold);color:var(--gold2)}
.lbtn:hover{background:var(--gold);color:#1a1200;transform:translateY(-2px)}
.lbtn small{display:block;font-family:'Barlow';font-size:.6rem;letter-spacing:.1em;opacity:.7}
.lbtn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.custom{display:flex;gap:8px;margin-top:10px}
.custom input{flex:1}
.admintools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:18px}
.actions .btn{flex:1;min-width:130px}
.hint{margin-top:14px;font-size:.82rem;color:var(--mute);text-align:center}

.nextup{margin-bottom:24px}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.section-h h2{font-family:'Teko';font-size:2rem;letter-spacing:.03em;display:flex;align-items:center;gap:10px}
.section-h h2 .em{font-size:1.4rem}
.section-h .ct{font-family:'Teko';font-size:1.3rem;color:var(--gold)}
.poolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.pcard{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:6px;padding:16px;text-align:center;transition:.18s;cursor:pointer;overflow:hidden}
.pcard:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 14px 30px rgba(0,0,0,.4)}
.pcard img{width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);margin-bottom:8px}
.pcard .nm{font-family:'Teko';font-size:1.4rem;line-height:1}
.pcard .bp{font-family:'Teko';font-size:1.2rem;color:var(--gold);margin-top:4px}
.ribbon{position:absolute;top:9px;right:-30px;transform:rotate(40deg);font:700 .62rem/1 'Barlow';letter-spacing:.12em;padding:4px 34px;text-transform:uppercase}
.ribbon.sold{background:var(--green);color:#06210f}
.ribbon.unsold{background:#5b6b80;color:#fff}
.ribbon.pool{background:var(--bat);color:#04121f}
.ribbon.lock{background:var(--red);color:#fff}
.pcard.dim{opacity:.6}
.pcard.dim:hover{transform:none;cursor:default;border-color:var(--line);box-shadow:none}

.purse{margin-top:8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative;transition:.18s}
.tcard:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.4)}
.tcard .stripe{height:5px;background:var(--tc)}
.tcard .body{padding:14px 16px}
.tcard .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tcard .tn{font-family:'Teko';font-size:1.45rem;line-height:1;display:flex;align-items:center;gap:8px}
.tcard .tn .sw{width:12px;height:12px;border-radius:3px;background:var(--tc);flex:none}
.tcard .ld{font:700 .6rem/1 'Barlow';letter-spacing:.1em;background:var(--green);color:#06210f;padding:4px 8px;border-radius:3px;animation:blink 1.4s infinite}
.tcard .rem{font-family:'Teko';font-size:2.3rem;color:var(--gold);line-height:.9;margin:4px 0 2px}
.tcard .bar{height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin:8px 0}
.tcard .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--tc),var(--gold));transition:width .6s}
.tcard .meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--mute)}
.tcard .meta b{color:#fff}
.squad{margin-top:10px;max-height:170px;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.sq{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,255,255,.04);border-radius:5px;padding:6px 9px;font-size:.86rem}
.sq .l{display:flex;align-items:center;gap:7px;min-width:0}
.sq .l img{width:24px;height:24px;border-radius:50%;object-fit:cover;border:1px solid var(--gold);flex:none}
.sq .l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.sq .pr{font-family:'Teko';font-size:1.1rem;color:var(--gold);flex:none}
.squad .empty{color:#5b6b80;font-size:.82rem;text-align:center;padding:8px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:6px;padding:16px;text-align:center;position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 0,rgba(245,197,24,.08),transparent 70%)}
.stat .v{font-family:'Teko';font-size:2.4rem;color:var(--gold);line-height:.9;position:relative}
.stat .v.g{color:var(--green)}.stat .v.r{color:var(--red)}.stat .v.b{color:var(--bat)}
.stat .l{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:4px;position:relative}

.login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;align-items:stretch}
.login .left{position:relative;overflow:hidden;display:flex;flex-direction:column;padding:40px;border-right:1px solid var(--line)}
.login .left .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.55) saturate(1.1)}
.login .left .bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,16,31,.4),rgba(6,16,31,.92))}
.login .left .inner{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;justify-content:space-between;gap:30px}
.login .left .kicker{font:700 .8rem/1 'Barlow';letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.login .left h1{font-family:'Teko';font-size:clamp(3rem,7vw,6rem);line-height:.85;letter-spacing:.01em}
.login .left h1 em{color:var(--gold);font-style:normal}
.callout{font-family:'Teko';font-size:clamp(2rem,5vw,3.4rem);letter-spacing:.06em;min-height:1.1em}
.callout .w{display:inline-block;animation:stampWord .5s}
@keyframes stampWord{0%{transform:scale(1.4);opacity:0}100%{transform:scale(1);opacity:1}}
.callout .w.once{color:#fff}.callout .w.twice{color:var(--gold2)}.callout .w.soldw{color:var(--green)}
.ministats{display:flex;gap:26px;flex-wrap:wrap}
.ministats .m .v{font-family:'Teko';font-size:2rem;color:var(--gold);line-height:1}
.ministats .m .l{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.login .marq{position:relative;z-index:2;overflow:hidden;border-top:1px solid var(--line);padding-top:12px}
.login .marq .track{display:inline-flex;gap:24px;white-space:nowrap;animation:tick 26s linear infinite;font-family:'Teko';font-size:1.3rem;letter-spacing:.05em;color:var(--mute)}
.login .marq .track b{color:var(--gold)}
.login .right{display:flex;align-items:center;justify-content:center;padding:40px;overflow-y:auto}
.logbox{width:100%;max-width:470px}
.logbox h2{font-family:'Teko';font-size:2.4rem;letter-spacing:.03em}
.logbox .sub{color:var(--mute);margin-bottom:20px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{flex:1;text-align:center;font-family:'Teko';font-size:1.3rem;letter-spacing:.05em;padding:9px;border-radius:5px;border:1px solid var(--line);color:var(--mute);cursor:pointer;transition:.18s}
.tab.on{background:rgba(245,197,24,.14);border-color:var(--gold);color:var(--gold)}
.fg{margin-bottom:14px}
.fg label{display:block;margin-bottom:6px}
.howto{border:1px dashed rgba(77,163,255,.5);background:rgba(77,163,255,.07);border-radius:6px;padding:12px 14px;font-size:.85rem;color:#bcd6f5;margin-bottom:18px;line-height:1.55}
.howto b{color:var(--gold)}
.locknote{margin-top:16px;font-size:.8rem;color:var(--mute);display:flex;align-items:center;gap:8px}

.ov{position:fixed;inset:0;z-index:200;background:rgba(3,8,18,.82);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--gold);border-radius:8px;padding:26px;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.modal h3{font-family:'Teko';font-size:1.9rem;letter-spacing:.03em;color:var(--gold);margin-bottom:18px;display:flex;align-items:center;gap:10px}
.modal .row2{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.phpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.phpick label{cursor:pointer;position:relative}
.phpick img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:2px solid var(--line);transition:.15s}
.phpick input{display:none}
.phpick input:checked+img{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,197,24,.3)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.qbtn{font-family:'Teko';font-size:1.1rem;padding:5px 12px;border-radius:5px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;cursor:pointer}
.qbtn:hover{border-color:var(--gold);color:var(--gold)}

.soldov{position:fixed;inset:0;z-index:300;background:radial-gradient(circle at 50% 40%,rgba(8,18,34,.9),rgba(3,8,18,.97));display:flex;align-items:center;justify-content:center;padding:20px}
.soldov .sc{text-align:center;max-width:640px}
.soldov .stamp{font-family:'Teko';font-weight:600;font-size:clamp(70px,16vw,180px);line-height:.8;display:inline-block;animation:stampIn .55s cubic-bezier(.2,2,.4,1)}
.soldov .stamp.s{color:var(--green);text-shadow:0 0 50px rgba(46,204,113,.5)}
.soldov .stamp.u{color:#7e8ca0;text-shadow:0 0 40px rgba(126,140,160,.4)}
@keyframes stampIn{0%{transform:scale(2.8) rotate(-14deg);opacity:0}60%{transform:scale(.94) rotate(-7deg);opacity:1}100%{transform:scale(1) rotate(-7deg)}}
.soldov .gavel{font-size:3.4rem;display:inline-block;animation:gavelSwing 1s ease;margin-bottom:6px}
@keyframes gavelSwing{0%,100%{transform:rotate(0)}25%{transform:rotate(-40deg)}50%{transform:rotate(14deg)}70%{transform:rotate(-6deg)}}
.soldov .who{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0;flex-wrap:wrap}
.soldov .who img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)}
.soldov .who .nm{font-family:'Teko';font-size:2.2rem}
.soldov .to{font-family:'Teko';font-size:1.8rem;display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.soldov .to .sw{width:16px;height:16px;border-radius:3px;flex:none}
.soldov .price{font-family:'Teko';font-size:clamp(2.6rem,8vw,4.4rem);color:var(--gold);line-height:.9;margin:6px 0}
.soldov .purseleft{font-family:'Teko';font-size:1.5rem;color:var(--green)}
.soldov .purseleft b{color:#fff}

.ledg-sec{margin-bottom:30px}
.ledg-sec h3{font-family:'Teko';font-size:1.7rem;letter-spacing:.04em;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.ledg-sec h3 .pill{font-family:'Barlow';font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.1em}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{width:auto;min-width:150px}

.rv{opacity:0;transform:translateY(16px);transition:.6s cubic-bezier(.2,.7,.3,1)}
.rv.in{opacity:1;transform:none}

.notif{position:fixed;top:78px;right:20px;z-index:400;padding:13px 20px;border-radius:6px;font-weight:600;max-width:360px;animation:slideIn .3s;border-left:4px solid}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}}
.notif.ok{background:rgba(46,204,113,.95);color:#06210f;border-color:#06210f}
.notif.err{background:rgba(255,65,54,.95);color:#fff;border-color:#7a0d06}
.notif.info{background:rgba(46,155,230,.95);color:#fff;border-color:#0a3a63}
.confetti{position:fixed;top:-20px;z-index:350;width:10px;height:14px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
.edgeflash{position:fixed;inset:0;z-index:150;pointer-events:none;box-shadow:inset 0 0 0 4px var(--gold),inset 0 0 90px rgba(245,197,24,.4);animation:edgeOut 1.1s ease forwards}
@keyframes edgeOut{from{opacity:1}to{opacity:0}}
.empty{text-align:center;color:#5b6b80;padding:40px 20px}
.empty .e{font-size:2.4rem;margin-bottom:8px}
.empty h4{font-family:'Teko';font-size:1.6rem;color:var(--mute);letter-spacing:.04em}
.waitcard{padding:34px;text-align:center}
.waitcard .big{font-size:3rem;animation:floaty 3s ease-in-out infinite;display:inline-block}
.waitcard h2{font-family:'Teko';font-size:2.2rem;letter-spacing:.03em;margin:6px 0}
.livesync{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:.8rem;color:var(--mute);border:1px dashed var(--line);border-radius:30px;padding:7px 14px}

#syncdiag{position:fixed;left:14px;bottom:14px;z-index:90;width:260px;background:rgba(6,16,31,.94);border:1px solid var(--line);border-radius:8px;font-size:11px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5)}
#syncdiag .sdg-h{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font:700 10px/1 'Barlow';letter-spacing:.22em;color:var(--gold);border-bottom:1px solid var(--line);user-select:none}
#syncdiag .sdg-h .sdg-min{margin-left:auto;color:var(--mute)}
#syncdiag.min .sdg-body{display:none}
#syncdiag.min .sdg-min{transform:rotate(180deg)}
#syncdiag .sdg-body{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
#syncdiag .sdg-row{display:flex;justify-content:space-between;gap:8px;color:var(--mute)}
#syncdiag .sdg-row b{color:#fff;font-weight:600;text-align:right}
#syncdiag .sdg-peers{display:flex;flex-wrap:wrap;gap:5px}
#syncdiag .sdg-peer{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:20px;padding:3px 9px;color:#cfe0f5}
#syncdiag .sdg-peer.me{border-color:var(--gold);color:var(--gold)}
#syncdiag .sdg-warn{background:rgba(255,65,54,.15);border:1px solid var(--red);color:#ffb3ae;border-radius:5px;padding:7px 9px;line-height:1.45}

@media(max-width:980px){
  .login{grid-template-columns:1fr}
  .login .left{min-height:300px;border-right:none;border-bottom:1px solid var(--line)}
  .block{grid-template-columns:1fr}
  .leadbox{text-align:left}.leadbox .who{justify-content:flex-start}
  .hdr{padding:10px 14px;gap:10px}.main{padding:18px 14px 50px}.nav{padding:10px 14px}
  .brand .t{font-size:1.4rem}.syncwrap{display:none}
  #syncdiag{width:210px}
}

<script>
/* ============================ 3D STADIUM BACKGROUND ============================ */
(function(){
  try{
    const cv=document.getElementById('bg3d');
    const scene=new THREE.Scene();
    const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
    const r=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
    r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));
    const grp=new THREE.Group();scene.add(grp);
    const ball=new THREE.Mesh(new THREE.SphereGeometry(1.5,40,40),new THREE.MeshPhongMaterial({color:0xB3202A,shininess:90,specular:0x552222}));
    grp.add(ball);
    const seam=new THREE.Mesh(new THREE.TorusGeometry(1.5,0.05,10,80),new THREE.MeshPhongMaterial({color:0xf2ead8}));
    seam.rotation.x=Math.PI/2;grp.add(seam);
    const seam2=new THREE.Mesh(new THREE.TorusGeometry(1.5,0.045,8,80),new THREE.MeshPhongMaterial({color:0xf2ead8,transparent:true,opacity:.5}));
    seam2.rotation.x=Math.PI/2;seam2.rotation.z=0.18;grp.add(seam2);
    grp.position.set(0,-0.4,-9);
    const N=380,pos=new Float32Array(N*3);
    for(let i=0;i<N*3;i++)pos[i]=(Math.random()-0.5)*46;
    const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const dust=new THREE.Points(pg,new THREE.PointsMaterial({size:0.07,color:0xF5C518,transparent:true,opacity:0.55}));
    scene.add(dust);
    function flood(x,z,rot){const c=new THREE.Mesh(new THREE.ConeGeometry(5,13,28,1,true),new THREE.MeshBasicMaterial({color:0xF5C518,transparent:true,opacity:0.045,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));c.position.set(x,7,z);c.rotation.z=rot;scene.add(c);}
    flood(-9,-7,0.55);flood(9,-7,-0.55);
    scene.add(new THREE.AmbientLight(0x445577,0.6));
    const l1=new THREE.PointLight(0xF5C518,1.3,60);l1.position.set(6,6,6);scene.add(l1);
    const l2=new THREE.PointLight(0x2E9BE6,0.8,60);l2.position.set(-6,-4,4);scene.add(l2);
    cam.position.z=14;
    let mx=0,my=0;addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-0.5)*2;my=(e.clientY/innerHeight-0.5)*2;});
    (function loop(){requestAnimationFrame(loop);const t=Date.now()*0.001;grp.rotation.y+=0.012;grp.rotation.x+=0.004;grp.position.y=-0.4+Math.sin(t)*0.5;dust.rotation.y+=0.0006;cam.position.x+=(mx*1.6-cam.position.x)*0.03;cam.position.y+=(-my*1.2-cam.position.y)*0.03;cam.lookAt(0,0,-6);r.render(scene,cam);})();
    addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);});
  }catch(e){}
})();

/* ============================ IMAGES ============================ */
const IMG={
  bat:'https://image.qwenlm.ai/public_source/7fbb715f-4500-4305-8399-4f8c6ec5690f/19d7fbec3-fe96-4faa-b04f-7a310f34b590.png',
  bowl:'https://image.qwenlm.ai/public_source/7fbb715f-4500-4305-8399-4f8c6ec5690f/11512b9cc-a75c-4ae3-b8f7-364de3bf67a8.png',
  ar:'https://image.qwenlm.ai/public_source/7fbb715f-4500-4305-8399-4f8c6ec5690f/11c678b04-6e1b-4c64-880a-e2e0ac148e7c.png',
  wk:'https://image.qwenlm.ai/public_source/7fbb715f-4500-4305-8399-4f8c6ec5690f/16391534c-90ee-42f6-b33f-6a2a2d0ec6f4.png',
  gavel:'https://image.qwenlm.ai/public_source/7fbb715f-4500-4305-8399-4f8c6ec5690f/1eb0af53f-145b-4e65-9b62-1d347733ae77.png'
};
const PHOTOS=[IMG.bat,IMG.bowl,IMG.ar,IMG.wk];
function avatar(name,color){const i=(name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();const c=color||'#F5C518';const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' fill='${c}'/><text x='50%' y='54%' font-family='Teko,Arial' font-size='92' fill='#0a1322' text-anchor='middle' dominant-baseline='middle' font-weight='700'>${i}</text></svg>`;return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);}
function imgTag(src,name,color,cls){return `<img class="${cls||''}" src="${src}" alt="${(name||'').replace(/"/g,'')}" onerror="this.onerror=null;this.src=avatar('${(name||'').replace(/'/g,'')}','${color||'#F5C518'}')">`;}

/* ============ FIREBASE CLOUD SYNC — paste your config here ============ */
const firebaseConfig={
  apiKey:"PASTE_API_KEY",
  authDomain:"PASTE_PROJECT.firebaseapp.com",
  databaseURL:"PASTE_DATABASE_URL",
  projectId:"PASTE_PROJECT_ID",
  storageBucket:"PASTE_PROJECT.appspot.com",
  messagingSenderId:"PASTE_SENDER_ID",
  appId:"PASTE_APP_ID"
};
let FB=null,FB_ON=false;
try{
  if(JSON.stringify(firebaseConfig).indexOf('PASTE')===-1){
    firebase.initializeApp(firebaseConfig);
    FB=firebase.database();FB_ON=true;
  }
}catch(e){FB_ON=false;}

/* ============================ DATA ============================ */
const K={t:'mpl27_teams',p:'mpl27_players',a:'mpl27_auction',s:'mpl27_sound',c:'mpl27_creds'};
const DEF_CREDS={adminUser:'admin',adminPass:'admin123'};
const DEF_TEAMS=[
 {id:'t1',name:'Mumbai Indians',short:'MI',color:'#1E6FBA',budget:1e9,pass:'mi123'},
 {id:'t2',name:'Chennai Super Kings',short:'CSK',color:'#F7C948',budget:1e9,pass:'csk123'},
 {id:'t3',name:'Royal Challengers Bengaluru',short:'RCB',color:'#C8102E',budget:1e9,pass:'rcb123'},
 {id:'t4',name:'Kolkata Knight Riders',short:'KKR',color:'#6C4AB0',budget:1e9,pass:'kkr123'},
 {id:'t5',name:'Delhi Capitals',short:'DC',color:'#2E9BE6',budget:1e9,pass:'dc123'},
 {id:'t6',name:'Rajasthan Royals',short:'RR',color:'#E5549B',budget:1e9,pass:'rr123'},
 {id:'t7',name:'Punjab Kings',short:'PBKS',color:'#D64541',budget:1e9,pass:'pbks123'},
 {id:'t8',name:'Sunrisers Hyderabad',short:'SRH',color:'#F2842B',budget:1e9,pass:'srh123'}
];
const DEF_PLAYERS=[
 {id:'p1',name:'Arjun Verma',cat:'Batsman',base:20000000,img:IMG.bat,pf:'Silk-timed top-order bat. 4100+ T20 runs @ 142 SR. Anchors or accelerates on demand.'},
 {id:'p2',name:'Kabir Khan',cat:'Bowler',base:15000000,img:IMG.bowl,pf:'Left-arm express pace, 145kph+. Lethal new-ball swing and toe-crushing yorkers.'},
 {id:'p3',name:'Dev Rathee',cat:'All-Rounder',base:10000000,img:IMG.ar,pf:'Power-hitting No.4 who rolls the arm over for 4 tidy overs of off-spin.'},
 {id:'p4',name:'Rishi Menon',cat:'Wicket-Keeper',base:7500000,img:IMG.wk,pf:'Glove work like silk, bat like a buzzsaw. Finishes games from No.5.'},
 {id:'p5',name:'Vikram Rao',cat:'Batsman',base:12000000,img:IMG.bat,pf:'360° stroke-maker. Reads spin early, sweeps everything in his arc.'},
 {id:'p6',name:'Sameer Joshi',cat:'Bowler',base:6000000,img:IMG.bowl,pf:'Mystery wrist-spinner. Googly you cannot pick, economy under 7.'},
 {id:'p7',name:'Aditya Bhatt',cat:'All-Rounder',base:25000000,img:IMG.ar,pf:'The franchise player. Opens the batting, bowls seam, fields like a panther.'},
 {id:'p8',name:'Nikhil Saini',cat:'Wicket-Keeper',base:5000000,img:IMG.wk,pf:'Lightning behind the stumps, 30+ stumpings a season. Handy lower-order hits.'},
 {id:'p9',name:'Farhan Sheikh',cat:'Batsman',base:8000000,img:IMG.bat,pf:'Explosive opener. 6 Powerplay overs = 60 runs, no apology.'},
 {id:'p10',name:'Manav Thakur',cat:'Bowler',base:10000000,img:IMG.bowl,pf:'Death-overs assassin. Slower balls and wide yorkers that freeze batters.'},
 {id:'p11',name:'Karan Pillai',cat:'All-Rounder',base:7000000,img:IMG.ar,pf:'Left-handed disruptor with bat, tidy left-arm medium with the ball.'},
 {id:'p12',name:'Sagar Naik',cat:'Batsman',base:4000000,img:IMG.bat,pf:'Young gun from the domestic circuit. Classical technique, modern intent.'},
 {id:'p13',name:'Ishaan Bose',cat:'Bowler',base:5500000,img:IMG.bowl,pf:'Chinaman bowler — a rare weapon that turns the game on its head.'},
 {id:'p14',name:'Rohan Das',cat:'Wicket-Keeper',base:6500000,img:IMG.wk,pf:'Calm head, clean hands. A keeper-batter who grows into the innings.'}
];
const DEF_STEPS=[1000000,5000000,10000000,25000000];
let storageOK=true;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){storageOK=false;return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){storageOK=false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){storageOK=false;}}
function load(k,d){try{const v=lsGet(k);return v?JSON.parse(v):JSON.parse(JSON.stringify(d));}catch(e){return JSON.parse(JSON.stringify(d));}}
function save(k,v){lsSet(k,JSON.stringify(v));}
let teams=load(K.t,DEF_TEAMS);
let players=load(K.p,DEF_PLAYERS);
let A=load(K.a,{pid:null,bid:0,lead:null,status:'idle',history:[]});
let CREDS=load(K.c,DEF_CREDS);
let soundOn=load(K.s,true);
let session=null;
let view='room';
let selTeam=null;
let loginRole='admin';
function normA(){if(!A||!Array.isArray(A.steps)||!A.steps.length)A.steps=DEF_STEPS.slice();}
function normC(){if(!CREDS||!CREDS.adminUser||!CREDS.adminPass)CREDS={adminUser:DEF_CREDS.adminUser,adminPass:DEF_CREDS.adminPass};}
normA();normC();

/* ============================ SYNC ENGINE ============================ */
const TAB_ID='w'+Math.random().toString(36).slice(2,9);
let BC=null;try{if('BroadcastChannel' in window){BC=new BroadcastChannel('mpl27_sync');BC.onmessage=e=>{const m=e.data;if(!m||m.src===TAB_ID)return;applyRemoteState('broadcast');};}}catch(e){BC=null;}
let pendingRender=false,lastChange=null,pollCount=0,lastRev=0;
function broadcastState(){if(BC){try{BC.postMessage({src:TAB_ID,type:'state'});}catch(e){}}}
function reloadAll(){teams=load(K.t,DEF_TEAMS);players=load(K.p,DEF_PLAYERS);A=load(K.a,{pid:null,bid:0,lead:null,status:'idle',history:[]});CREDS=load(K.c,DEF_CREDS);normA();normC();}
function appInputFocused(){const a=document.activeElement;if(!a)return false;const tag=a.tagName;return (tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')&&document.getElementById('app')&&document.getElementById('app').contains(a);}
function pulseSync(){lastChange=new Date();const d=document.getElementById('syncdot');if(d){d.classList.remove('pulse');void d.offsetWidth;d.classList.add('pulse');}}
function flashEdge(){if(!session)return;const f=document.createElement('div');f.className='edgeflash';document.body.appendChild(f);setTimeout(()=>f.remove(),1200);}

function pushFB(){if(!FB_ON)return;lastRev=Date.now();try{FB.ref('state').set({rev:lastRev,teams:teams,players:players,a:A,c:CREDS});}catch(e){}}
if(FB_ON){
  try{
    FB.ref('state').on('value',s=>{
      const v=s.val();
      if(!v){pushFB();return;}
      if(v.rev===lastRev)return;
      lastRev=v.rev;
      save(K.t,v.teams);save(K.p,v.players);save(K.a,v.a);if(v.c)save(K.c,v.c);
      applyNewState(v.teams,v.players,v.a,v.c,'firebase');
    });
  }catch(e){FB_ON=false;}
}
function saveT(){save(K.t,teams);broadcastState();pushFB();}
function saveP(){save(K.p,players);broadcastState();pushFB();}
function saveA(){normA();save(K.a,A);broadcastState();pushFB();}
function saveC(){normC();save(K.c,CREDS);broadcastState();pushFB();}
function manualSync(){applyRemoteState('manual');notify('Synced with live auction state.','ok');}

function applyNewState(nt,np,na,nc,src){
  try{
    const oldA=A,oldP=players;
    teams=nt||teams;players=np||players;A=na||A;if(nc)CREDS=nc;
    normA();normC();
    pulseSync();
    const wasLive=oldA.status==='live',nowLive=A.status==='live';
    let transition=false;
    if(!wasLive&&nowLive){
      transition=true;
      const p=curPlayer();
      if(session&&session.role==='team'){view='room';notify('🔨 '+(p?p.name:'A player')+' is on the block — place your bid!','info');}
      else if(session){notify('🔨 '+(p?p.name:'A player')+' called to the block.','info');}
      if(session){sGavel();flashEdge();}
    }
    if(wasLive&&!nowLive){
      transition=true;
      if(!document.getElementById('soldov')){
        const soldNow=players.find(p=>p.status==='sold'&&!oldP.some(o=>o.id===p.id&&o.status==='sold'));
        const unsoldNow=players.find(p=>p.status==='unsold'&&!oldP.some(o=>o.id===p.id&&o.status==='unsold'));
        if(soldNow){const t=teamOf(soldNow.soldTo);showSoldOverlay({name:soldNow.name,img:soldNow.img,team:t?t.name:'',short:t?t.short:'',color:t?t.color:'#F5C518',price:soldNow.soldPrice,purseLeft:t?t.budget:0},'sold');confetti();sSold();}
        else if(unsoldNow){showSoldOverlay({name:unsoldNow.name,img:unsoldNow.img,base:unsoldNow.base},'unsold');sUnsold();}
      }
    }
    if(!transition&&appInputFocused()){pendingRender=true;return;}
    pendingRender=false;
    render();
  }catch(e){}
}
function applyRemoteState(src){applyNewState(load(K.t,DEF_TEAMS),load(K.p,DEF_PLAYERS),load(K.a,{pid:null,bid:0,lead:null,status:'idle',history:[]}),load(K.c,DEF_CREDS),src);}
function checkNow(src){
  try{
    const na=lsGet(K.a),nt=lsGet(K.t),np=lsGet(K.p),nc=lsGet(K.c);
    if((na&&na!==JSON.stringify(A))||(nt&&nt!==JSON.stringify(teams))||(np&&np!==JSON.stringify(players))||(nc&&nc!==JSON.stringify(CREDS)))applyRemoteState(src);
    else if(pendingRender&&!appInputFocused()){pendingRender=false;render();}
  }catch(e){}
}
addEventListener('storage',e=>{if(e.key&&(e.key===K.t||e.key===K.p||e.key===K.a||e.key===K.c))applyRemoteState('storage');});
setInterval(()=>{pollCount++;checkNow('poll');},400);
addEventListener('focus',()=>checkNow('focus'));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkNow('vis');});

function roleLabel(){if(!session)return 'Gate';if(session.role==='admin')return 'Auctioneer';const t=teamOf(session.teamId);return t?t.short:'Team';}
function hbWrite(){lsSet('mpl27_hb_'+TAB_ID,JSON.stringify({ts:Date.now(),role:roleLabel()}));}
setInterval(hbWrite,1500);
addEventListener('beforeunload',()=>lsDel('mpl27_hb_'+TAB_ID));
function buildDiag(){
  const d=document.createElement('div');d.id='syncdiag';
  d.innerHTML=`<div class="sdg-h"><span class="syncdot"></span>TRANSMISSION<span class="sdg-min">▾</span></div><div class="sdg-body"></div>`;
  d.querySelector('.sdg-h').addEventListener('click',()=>d.classList.toggle('min'));
  document.body.appendChild(d);
}
function updateDiag(){
  const box=document.getElementById('syncdiag');if(!box)return;
  let peers=[],blocked=!storageOK;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.indexOf('mpl27_hb_')===0){
        try{const v=JSON.parse(localStorage.getItem(k));if(Date.now()-v.ts<5000)peers.push({mine:k===('mpl27_hb_'+TAB_ID),role:v.role});}catch(e){}
      }
    }

/* ============================ HELPERS ============================ */
function fmt(a){a=+a||0;if(a>=1e7){let v=Math.round(a/1e7*100)/100;return '₹'+trimZ(v)+' Cr';}if(a>=1e5){let v=Math.round(a/1e5*100)/100;return '₹'+trimZ(v)+' L';}return '₹'+a.toLocaleString('en-IN');}
function trimZ(v){return (v%1===0)?v.toString():v.toString().replace(/0+$/,'').replace(/\.$/,'');}
function gid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function catClass(c){c=(c||'').toLowerCase();if(c.includes('bat'))return 'bat';if(c.includes('bowl'))return 'bowl';if(c.includes('all'))return 'ar';return 'wk';}
function curPlayer(){return players.find(p=>p.id===A.pid)||null;}
function teamOf(id){return teams.find(t=>t.id===id);}
function squadOf(id){return players.filter(p=>p.status==='sold'&&p.soldTo===id);}
function spentOf(id){return squadOf(id).reduce((s,p)=>s+(p.soldPrice||0),0);}
function stepsNow(){return (A.steps&&A.steps.length)?A.steps:DEF_STEPS;}
function ladderFor(p){
  const st=stepsNow();
  if(!A.bid)return [{v:p.base,open:true}].concat(st.slice(0,3).map(s=>({v:p.base+s,open:false})));
  return st.map(s=>({v:A.bid+s,open:false}));
}
function minNext(){const p=curPlayer();if(!p)return 0;return A.bid?A.bid+stepsNow()[0]:p.base;}
function notify(m,t){const n=document.createElement('div');n.className='notif '+(t||'info');n.textContent=m;document.body.appendChild(n);setTimeout(()=>{n.style.transition='.3s';n.style.opacity='0';n.style.transform='translateX(120%)';setTimeout(()=>n.remove(),300);},2800);}

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,dur,type,vol,when){if(!soundOn)return;const c=ac();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;const t=c.currentTime+(when||0);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||0.2,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function sTick(amt){tone(420+Math.min(600,Math.log10(amt+1)*90),0.09,'triangle',0.18);}
function sGavel(){tone(150,0.08,'sine',0.4,0);tone(110,0.12,'sine',0.4,0.12);}
function sSold(){[660,830,990,1320].forEach((f,i)=>tone(f,0.22,'square',0.16,i*0.09));}
function sUnsold(){tone(330,0.18,'sawtooth',0.14,0);tone(247,0.26,'sawtooth',0.14,0.14);}
addEventListener('pointerdown',()=>ac(),{once:true});

function confetti(){const cols=['#F5C518','#FF4136','#2ECC71','#2E9BE6','#E5549B','#6C4AB0','#fff'];for(let i=0;i<90;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.animationDuration=(2+Math.random()*2)+'s';d.style.animationDelay=(Math.random()*0.6)+'s';d.style.width=(6+Math.random()*8)+'px';d.style.height=(8+Math.random()*10)+'px';d.style.borderRadius=Math.random()>0.5?'50%':'2px';document.body.appendChild(d);setTimeout(()=>d.remove(),4500);}}

  const p=curPlayer();
  if(v>0&&p&&v<p.base)return notify('Cannot go below base price '+fmt(p.base)+'.','err');
  if(v===0){A.bid=0;A.lead=null;}else{A.bid=v;}
  saveA();closeModal();
  notify('Current bid set to '+(v?fmt(v):'no bids')+'.','ok');
  render();
}

function playerCardsHTML(admin,filter,q){
  let list=players.slice();
  if(filter&&filter!=='all')list=list.filter(p=>p.status===filter);
  if(q)list=list.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));
  if(!list.length)return `<div class="empty" style="grid-column:1/-1"><div class="e">🔍</div><h4>No players match.</h4></div>`;
  return list.map(p=>{
    const onBlock=A.status==='live'&&A.pid===p.id;
    const buyer=p.soldTo?teamOf(p.soldTo):null;
    const click=admin?(onBlock?`onclick="notify('This player is currently on the block — finish the auction first.','err')"`:`onclick="playerModal('${p.id}')"`):'';
    const dim=(!admin&&p.status==='unsold')?'dim':'';
    const rib=p.status==='sold'?`<span class="ribbon sold">SOLD</span>`:p.status==='unsold'?`<span class="ribbon unsold">UNSOLD</span>`:onBlock?`<span class="ribbon lock">ON BLOCK</span>`:`<span class="ribbon pool">POOL</span>`;
    return `<div class="pcard ${dim}" ${click} style="${admin?'':'cursor:default'}">
      ${rib}
      ${imgTag(p.img,p.name,'#F5C518')}
      <div class="nm">${p.name}</div>
      <span class="chip ${catClass(p.cat)}">${p.cat}</span>
      <div class="bp">${p.status==='sold'?fmt(p.soldPrice):'Base '+fmt(p.base)}</div>
      ${buyer?`<div style="font-size:.78rem;color:var(--mute);margin-top:4px">→ <b style="color:${buyer.color}">${buyer.short}</b></div>`:''}
    </div>`;
  }).join('');
}

function savePlayer(id){
  const name=(document.getElementById('pm-name').value||'').trim();if(!name)return notify('Name is required.','err');
  const cat=document.getElementById('pm-cat').value;
  const base=+document.getElementById('pm-base').value||0;
  const custImg=(document.getElementById('pm-img').value||'').trim();
  const radio=document.querySelector('input[name=ph]:checked');
  const img=custImg||(radio?radio.value:IMG.bat);
  const pf=(document.getElementById('pm-pf').value||'').trim();
  if(id){
    const p=players.find(x=>x.id===id);
    const newSt=document.getElementById('pm-st').value;
    if(p.status==='sold'&&newSt!=='sold'){const t=teamOf(p.soldTo);if(t)t.budget+=(p.soldPrice||0);delete p.soldTo;delete p.soldPrice;}
    if(newSt==='sold'&&p.status!=='sold')notify('Use the Auction Room to sell a player so the purse deducts correctly.','err');
    Object.assign(p,{name:name,cat:cat,base:base,img:img,pf:pf,status:newSt==='sold'?p.status:newSt});
    notify('Player updated.','ok');
  }else{
    players.push({id:gid(),name:name,cat:cat,base:base,img:img,pf:pf,status:'pool'});
    notify('Player added to the pool.','ok');
  }
  saveP();saveT();closeModal();render();
}
function deletePlayer(id){
  const p=players.find(x=>x.id===id);if(!p)return;
  if(A.status==='live'&&A.pid===id)return notify('Cannot delete — player is on the block.','err');
  if(!confirm('Delete '+p.name+'?'))return;
  if(p.status==='sold'){const t=teamOf(p.soldTo);if(t)t.budget+=(p.soldPrice||0);}
  players=players.filter(x=>x.id!==id);saveP();saveT();closeModal(true);notify('Player deleted.','info');render();
}

/* ============================ AUCTION ACTIONS ============================ */
function toBlock(id){
  if(A.status==='live')return notify('Finish the current player first.','err');
  const p=players.find(x=>x.id===id);if(!p)return;
  A={pid:id,bid:0,lead:null,status:'live',history:A.history||[],steps:A.steps||DEF_STEPS};
  selTeam=null;
  saveA();
  sGavel();notify('🔨 '+p.name+' called to the block!','info');render();
}
function pickTeam(id){selTeam=id;render();}
function placeBid(amt){
  const p=curPlayer();if(!p||A.status!=='live')return;
  const tid=session.role==='admin'?selTeam:session.teamId;
  if(!tid)return notify('Select a bidding franchise first.','err');
  const t=teamOf(tid);if(!t)return;
  if(A.lead===tid)return notify(t.short+' already holds the top bid.','err');
  const floor=A.bid?ladderFor(p)[0].v:p.base;
  if(amt<floor)return notify('Bid must be at least '+fmt(floor)+'.','err');
  if(amt>t.budget)return notify(t.short+" can't afford "+fmt(amt)+'.','err');
  A.bid=amt;A.lead=tid;A.history.push({s:t.short,n:p.name,a:amt,t:Date.now()});
  saveA();sTick(amt);render();
}
function customBid(){
  const el=document.getElementById('cst');const v=+((el||{}).value||0);
  if(!v)return notify('Enter a valid amount.','err');
  const p=curPlayer();const floor=A.bid?ladderFor(p)[0].v:(p?p.base:0);
  if(v<floor)return notify('Minimum bid is '+fmt(floor)+'.','err');
  placeBid(v);
}
function passBid(){const t=teamOf(session.teamId);notify(t.short+' passed on this round.','info');}
function hammer(){
  if(!A.lead)return notify('No bid to hammer down!','err');
  const p=curPlayer();const t=teamOf(A.lead);if(!p||!t)return;
  if(t.budget<A.bid)return notify(t.short+' purse is below the winning bid — adjust the bag first.','err');
  t.budget-=A.bid;
  p.status='sold';p.soldTo=t.id;p.soldPrice=A.bid;
  const purseLeft=t.budget;
  A.history.push({s:'SOLD',n:p.name,a:A.bid,t:Date.now()});
  const cap={name:p.name,img:p.img,cat:p.cat,team:t.name,short:t.short,color:t.color,price:A.bid,purseLeft:purseLeft};
  A={pid:null,bid:0,lead:null,status:'idle',history:A.history,steps:A.steps};
  selTeam=null;
  saveT();saveP();saveA();
  sGavel();setTimeout(sSold,180);confetti();
  showSoldOverlay(cap,'sold');
}
function markUnsold(){
  const p=curPlayer();if(!p)return;
  p.status='unsold';
  const cap={name:p.name,img:p.img,cat:p.cat,base:p.base};
  A={pid:null,bid:0,lead:null,status:'idle',history:A.history,steps:A.steps};selTeam=null;
  saveP();saveA();
  sUnsold();showSoldOverlay(cap,'unsold');
}
function withdraw(){
  if(!confirm('Withdraw this player from the block and return him to the pool?'))return;
  A={pid:null,bid:0,lead:null,status:'idle',history:A.history,steps:A.steps};selTeam=null;
  saveA();
  notify('Player withdrawn to the pool.','info');render();
}
function showSoldOverlay(c,kind){
  const old=document.getElementById('soldov');if(old)old.remove();
  const o=document.createElement('div');o.className='soldov';o.id='soldov';
  if(kind==='sold'){
    o.innerHTML=`<div class="sc">
      <div class="gavel">🔨</div>
      <div class="stamp s">SOLD!</div>
      <div class="who">${imgTag(c.img,c.name,c.color)}<div class="nm">${c.name}</div></div>
      <div class="to">goes to <span class="sw" style="background:${c.color}"></span><b style="color:${c.color}">${c.team}</b></div>
      <div class="price">${fmt(c.price)}</div>
      <div class="purseleft">${c.short} purse left · <b>${fmt(c.purseLeft)}</b></div>
      <div style="margin-top:22px"><button class="btn btn-gold" onclick="closeSold()">Next Player →</button></div>
    </div>`;
  }else{
    o.innerHTML=`<div class="sc">
      <div style="font-size:3rem">✋</div>
      <div class="stamp u">UNSOLD</div>
      <div class="who">${imgTag(c.img,c.name,'#7e8ca0')}<div class="nm">${c.name}</div></div>
      <div style="font-family:'Teko';font-size:1.6rem;color:var(--mute)">No buyer at base ${fmt(c.base)}</div>
      <div style="margin-top:22px"><button class="btn btn-gold" onclick="closeSold()">Next Player →</button></div>
    </div>`;
  }
  document.body.appendChild(o);
}
function closeSold(){const o=document.getElementById('soldov');if(o)o.remove();pendingRender=false;render();}

setInterval(()=>{const el=document.getElementById('callout');if(!el)return;const seq=[['GOING ONCE…','once'],['GOING TWICE…','twice'],['SOLD!','soldw']];const i=Math.floor(Date.now()/1500)%3;el.innerHTML=`<span class="w ${seq[i][1]}">${seq[i][0]}</span>`;},400);

restoreSession();
buildDiag();
hbWrite();
render();
updateDiag();
</script>
</body>
</html>
